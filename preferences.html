<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Preferences | Wanderlust</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
  </head>

  <body class="page-cream">
    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-container">
        <a href="index.html" class="brand-logo">
          <span class="logo-mark">⌁</span>
          WANDERLUST
        </a>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="explore.html">Explore</a></li>
          <li><a href="preferences.html" class="active">Preferences</a></li>
          <li><a href="destination.html">Destination</a></li>
          <li><a href="about.html">About</a></li>
        </ul>

        <a href="preferences.html" class="btn btn-navy nav-button">
          Plan your escape
        </a>

        <button class="menu-toggle" type="button" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    <main>
      <!-- Dealbreakers -->
      <section class="page-section">
        <div class="container">
          <span class="eyebrow"
            ><span class="eyebrow-dot"></span>Filter Your Experience</span
          >
          <h2 class="section-title">Set Your Dealbreakers &amp; Must-Haves</h2>

          <div class="vibe-grid">
            <button class="vibe-card" type="button" data-vibe="beaches">
              <div
                class="card-img"
                style="
                  background-image: url(&quot;https://i.pinimg.com/736x/b4/8b/98/b48b982f083b43786507475a8bc3c839.jpg&quot;);
                "
              ></div>
              <div class="vibe-footer">
                <span>Sandy Beaches</span>
                <span class="vibe-toggle">✕</span>
              </div>
            </button>

            <button
              class="vibe-card selected"
              type="button"
              data-vibe="mountains"
            >
              <div
                class="card-img"
                style="
                  background-image: url(&quot;https://i.pinimg.com/736x/71/52/a7/7152a72c84d64759a0ed4b5a98443b75.jpg&quot;);
                "
              ></div>
              <div class="vibe-footer">
                <span>Mountain Retreats</span>
                <span class="vibe-toggle">✓</span>
              </div>
            </button>

            <button class="vibe-card" type="button" data-vibe="tropical">
              <div
                class="card-img"
                style="
                  background-image: url(&quot;https://i.pinimg.com/1200x/90/c0/54/90c05497c0b0a9a38c4a91671c075612.jpg&quot;);
                "
              ></div>
              <div class="vibe-footer">
                <span>Tropical Humidity</span>
                <span class="vibe-toggle">✕</span>
              </div>
            </button>

            <button
              class="vibe-card selected"
              type="button"
              data-vibe="cultural"
            >
              <div
                class="card-img"
                style="
                  background-image: url(&quot;https://i.pinimg.com/736x/70/ee/f1/70eef1b314df085c9fe4985ea3fe400b.jpg&quot;);
                "
              ></div>
              <div class="vibe-footer">
                <span>Cultural Cities</span>
                <span class="vibe-toggle">✓</span>
              </div>
            </button>

            <button class="vibe-card selected" type="button" data-vibe="desert">
              <div
                class="card-img"
                style="
                  background-image: url(&quot;https://i.pinimg.com/1200x/ce/6c/15/ce6c158e4016c25decfb7eaa15a6fb19.jpg&quot;);
                "
              ></div>
              <div class="vibe-footer">
                <span>Desert Landscapes</span>
                <span class="vibe-toggle">✓</span>
              </div>
            </button>

            <button class="vibe-card selected" type="button" data-vibe="cliffs">
              <div
                class="card-img"
                style="
                  background-image: url(&quot;https://i.pinimg.com/736x/86/f6/90/86f690863123f74a487ce005f058ad3c.jpg&quot;);
                "
              ></div>
              <div class="vibe-footer">
                <span>Coastal Cliffs</span>
                <span class="vibe-toggle">✓</span>
              </div>
            </button>
          </div>

          <div class="center-cta">
            <a href="explore.html" class="btn btn-coral" id="apply-prefs"
              >Apply Preferences &amp; Explore →</a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
